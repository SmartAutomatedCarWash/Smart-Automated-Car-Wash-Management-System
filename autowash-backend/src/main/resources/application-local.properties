spring.config.import=optional:file:./.env[.properties],optional:file:./autowash-backend/.env[.properties]

spring.datasource.url=${AUTOWASH_DB_URL:jdbc:postgresql://localhost:5432/autowash}
spring.datasource.username=${AUTOWASH_DB_USERNAME:postgres}
spring.datasource.password=${AUTOWASH_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${AUTOWASH_DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.default_schema=${AUTOWASH_DB_SCHEMA:autowash_local}

spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${AUTOWASH_DB_SCHEMA:autowash_local}
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-missing-migrations=true
spring.flyway.out-of-order=true

autowash.auth.google.dev-bypass-enabled=false
